<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>MFMA Driver Portal</title>
<link rel="stylesheet" href="styles.css?v=74"></head>
<body class="display-body"><section id="display" class="display flag-clear">
<div class="display-top"><div class="display-brand"><img id="display-brand-logo" src="assets/branding/mfma-logo.png" alt="MFMA"></div><div class="display-tools"><button id="display-sound" class="display-sound" type="button">Enable Sound</button><div id="display-status" class="display-status"><span class="dot"></span><span>Connecting</span></div></div></div>
<div id="status-view" class="status-view"><div class="safety-car-emblem" aria-hidden="true"><i class="safety-yellow"></i><i class="safety-red"></i></div><div id="status-kicker" class="status-kicker">MFMA DIGITAL FLAG NETWORK</div><div id="status-title" class="status-title">NO ACTIVE EVENT</div><div id="status-detail" class="status-detail">Race Control has not opened an event.</div><div id="standby-leaderboard" class="driver-leaderboard hidden"></div></div>
<div id="live-view" class="live-view hidden"><img id="steward-brand" class="steward-brand hidden" src="assets/branding/mra-logo.png" alt="MFMA Race Authority"><div id="display-session" class="display-session"></div><div id="display-timer" class="display-timer">00:00</div><div class="safety-car-emblem" aria-hidden="true"><i class="safety-yellow"></i><i class="safety-red"></i></div><div id="label" class="signal-label">MFMA</div><div id="instruction" class="signal-instruction">STANDBY</div></div>
<aside id="safety-management" class="safety-management hidden" aria-live="polite"><img src="assets/branding/mra-logo.png" alt=""><div><span>MRA RACE MANAGEMENT</span><strong id="safety-message"></strong></div></aside>
<section id="driver-tools" class="driver-tools hidden" aria-label="Driver portal controls">
<div class="driver-identity"><label><span>Vehicle</span><select id="driver-vehicle"><option value="ranger">Ranger</option><option value="shelly">Shelly</option><option value="gator">Gator</option></select></label><strong id="driver-role">Standby</strong></div>
<div class="hazard-actions" aria-label="Request Race Control action">
<button class="hazard-request safety-request" data-hazard-request="safety-car" type="button">Request Safety Car</button>
<button class="hazard-request red-request" data-hazard-request="red-flag" type="button">Request Red Flag</button>
</div>
<div id="driver-hazard-status" class="driver-hazard-status" aria-live="polite"></div>
<section class="crew-compact">
<button id="crew-toggle" class="crew-summary" type="button" aria-expanded="false"><span><strong>Signed In</strong><small id="crew-names">Driver profile</small></span><b id="crew-action">Edit</b></button>
<button id="driver-sign-out" class="driver-sign-out" type="button">Sign Out</button>
<form id="occupant-form" class="driver-report-form hidden">
<label>Driver<input id="driver-name" autocomplete="name" required maxlength="50"></label>
<label>Passenger <small>(optional)</small><input id="passenger-name" autocomplete="name" maxlength="50"></label>
<div class="button-row"><button id="crew-cancel" class="action secondary-btn" type="button">Cancel</button><button id="crew-submit" class="action primary-btn" type="submit">Submit</button></div>
</form><p id="occupant-status" class="report-status" role="status"></p>
</section>
</section>
<section id="driver-signin" class="driver-signin" aria-label="Driver Portal sign in"><form id="driver-signin-form" class="driver-signin-card"><img src="assets/branding/mfma-driver-portal-logo.png" alt="MFMA Driver Portal"><div><p class="eyebrow">Driver Access</p><h1>Sign In</h1><p>Choose your vehicle and identify its occupants for Race Control.</p></div><label>Vehicle<select id="signin-vehicle"><option value="ranger">Ranger</option><option value="shelly">Shelly</option><option value="gator">Gator</option></select></label><label>Driver<input id="signin-driver" autocomplete="name" required maxlength="50"></label><label>Passenger <small>(optional)</small><input id="signin-passenger" autocomplete="name" maxlength="50"></label><button id="driver-signin-submit" class="action primary-btn" type="submit">Enter Driver Portal</button><p id="driver-signin-status" class="report-status" role="status"></p></form></section>
<div class="display-footer"><span>MFMA DRIVER PORTAL</span><span>MRA SAFETY MANAGEMENT</span></div>
</section><script type="module" src="display.js?v=74"></script></body></html>
